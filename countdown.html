<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Timer - PS3 HEN</title>
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --neon: #00f3ff;
            --warning: #ffaa00;
            --danger: #ff003c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        .container { text-align: center; width: 100%; max-width: 800px; padding: 20px; z-index: 2; }
        
        .header-info { margin-bottom: 30px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .header-info h2 { color: var(--neon); text-transform: uppercase; letter-spacing: 2px; }
        .header-info p { font-family: sans-serif; font-size: 1.1rem; margin-top: 5px; }

        .timer-box { position: relative; display: inline-block; }
        .timer { font-size: 6rem; font-weight: bold; text-shadow: 0 0 20px var(--neon), 0 0 40px var(--neon); color: #fff; transition: all 0.3s ease; }
        .timer.warning { color: var(--warning); text-shadow: 0 0 20px var(--warning), 0 0 40px var(--warning); animation: pulse 1s infinite alternate; }
        .timer.danger { color: var(--danger); text-shadow: 0 0 20px var(--danger), 0 0 40px var(--danger); animation: shake 0.5s infinite; }
        
        .status-text { font-family: sans-serif; font-size: 1.5rem; margin-top: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--neon); }

        .admin-note { margin-top: 40px; background: rgba(255, 0, 60, 0.1); border-left: 5px solid var(--danger); padding: 15px; text-align: left; font-family: sans-serif; display: none; }
        .admin-note h4 { color: var(--danger); margin-bottom: 5px; }

        /* Overlay Start Audio Context */
        #audioOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .btn-start { padding: 20px 40px; font-size: 1.5rem; background: var(--neon); color: #000; border: none; border-radius: 10px; font-family: sans-serif; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px var(--neon); }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        
        @media (max-width: 600px) {
            .timer { font-size: 4rem; }
            .header-info h2 { font-size: 1.2rem; }
            .header-info p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Overlay Required to unlock browser audio -->
    <div id="audioOverlay">
        <h2 style="color:white; font-family:sans-serif; margin-bottom:20px; text-align:center;">Pantauan Layar Rental Aktif</h2>
        <button class="btn-start" onclick="initAudio()">Masuk & Aktifkan Suara</button>
    </div>

    <div class="container">
        <div class="header-info" id="infoBox" style="display:none;">
            <h2 id="userName">Loading...</h2>
            <p>ID: <span id="bookingIdText">-</span> | <span id="packageName">-</span></p>
        </div>

        <div class="timer-box">
            <div class="timer" id="timerDisplay">00:00:00</div>
            <div class="status-text" id="statusDisplay">MENUNGGU ADMIN...</div>
        </div>

        <div class="admin-note" id="adminNoteBox">
            <h4>PESAN DARI ADMIN:</h4>
            <p id="adminNoteText"></p>
        </div>
    </div>

    <!-- Firebase SDK (Modular v9 via module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5S1jEFxw_tGWHBVqGe_erZSsOKRK2gU",
            authDomain: "rental-ps3-hen.firebaseapp.com",
            databaseURL: "https://rental-ps3-hen-default-rtdb.firebaseio.com",
            projectId: "rental-ps3-hen",
            storageBucket: "rental-ps3-hen.firebasestorage.app",
            messagingSenderId: "209728877379",
            appId: "1:209728877379:web:3fcd356cc427c5172af5f6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('id');

        // Audio Synthesis (No external files needed)
        window.audioCtx = null;
        window.initAudio = function() {
            document.getElementById('audioOverlay').style.display = 'none';
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Silent init ping
            let osc = audioCtx.createOscillator();
            osc.frequency.value = 1;
            osc.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(0.01);
        }

        function playBeep(type) {
            if(!window.audioCtx) return;
            const osc = window.audioCtx.createOscillator();
            const gain = window.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(window.audioCtx.destination);
            
            if(type === 'warning') {
                // 10 minute warning beep
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, window.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, window.audioCtx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, window.audioCtx.currentTime + 0.5);
                osc.stop(window.audioCtx.currentTime + 0.5);
            } else if(type === 'alarm') {
                // End time alarm (continuous siren simulation)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, window.audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, window.audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, window.audioCtx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, window.audioCtx.currentTime + 1);
                osc.stop(window.audioCtx.currentTime + 1);
            }
        }

        // Timer Logic
        let bookingData = null;
        let warningPlayed = false;
        let alarmTriggered = false;
        let alarmInterval = null;

        if(!bookingId) {
            document.getElementById('statusDisplay').innerText = "LINK TIDAK VALID";
        } else {
            document.getElementById('infoBox').style.display = 'block';
            document.getElementById('bookingIdText').innerText = bookingId;
            
            // Listen realtime from DB
            onValue(ref(db, `bookings/${bookingId}`), (snapshot) => {
                bookingData = snapshot.val();
                if(!bookingData) {
                    document.getElementById('statusDisplay').innerText = "DATA TIDAK DITEMUKAN";
                    return;
                }
                
                document.getElementById('userName').innerText = bookingData.nama;
                document.getElementById('packageName').innerText = bookingData.paket_nama;
                
                // Notes Check
                if(bookingData.catatan_admin && bookingData.catatan_admin.trim() !== "") {
                    document.getElementById('adminNoteBox').style.display = 'block';
                    document.getElementById('adminNoteText').innerText = bookingData.catatan_admin;
                } else {
                    document.getElementById('adminNoteBox').style.display = 'none';
                }
                
                // Reset flags if time is added back above thresholds
                let remCheck = calculateRemaining(bookingData);
                if(remCheck > 600000) warningPlayed = false;
                if(remCheck > 0) {
                    alarmTriggered = false;
                    clearInterval(alarmInterval);
                }
                
                updateUI();
            });
        }

        function calculateRemaining(b) {
            if (b.status_countdown === 'running') return b.waktu_selesai - Date.now();
            return b.sisa_waktu; // paused or idle
        }

        function updateUI() {
            if(!bookingData) return;
            
            const timerEl = document.getElementById('timerDisplay');
            const statusEl = document.getElementById('statusDisplay');
            
            let remTime = calculateRemaining(bookingData);
            
            if (bookingData.status_countdown === 'idle') {
                statusEl.innerText = "SIAP DIMULAI";
                statusEl.style.color = "var(--neon)";
                timerEl.className = "timer";
            } 
            else if (bookingData.status_countdown === 'paused') {
                statusEl.innerText = "JEDA / PAUSED";
                statusEl.style.color = "var(--warning)";
                timerEl.className = "timer warning";
            }
            else if (bookingData.status_countdown === 'running') {
                statusEl.innerText = "SEDANG BERMAIN";
                statusEl.style.color = "#00ff66";
                timerEl.className = "timer";
                
                // Audio Warnings
                if(remTime <= 600000 && remTime > 0 && !warningPlayed) {
                    playBeep('warning');
                    warningPlayed = true; // only play once
                }
                
                // Visual Warnings
                if(remTime <= 600000 && remTime > 0) {
                    statusEl.innerText = "SISA WAKTU < 10 MENIT!";
                    timerEl.className = "timer warning";
                }
            }
            else if (bookingData.status_countdown === 'finished') {
                statusEl.innerText = "WAKTU HABIS!";
                statusEl.style.color = "var(--danger)";
                timerEl.className = "timer danger";
                remTime = 0;
            }

            if(remTime <= 0 && bookingData.status_countdown === 'running') {
                statusEl.innerText = "WAKTU HABIS, SILAKAN HUBUNGI ADMIN!";
                statusEl.style.color = "var(--danger)";
                timerEl.className = "timer danger";
                remTime = 0;
                
                if(!alarmTriggered) {
                    alarmTriggered = true;
                    // Play alarm repeatedly every 1.5 seconds when time is up
                    alarmInterval = setInterval(() => playBeep('alarm'), 1500);
                }
            }

            // Format Timer Text
            let totalSeconds = Math.max(0, Math.floor(remTime / 1000));
            let h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let s = (totalSeconds % 60).toString().padStart(2, '0');
            timerEl.innerText = `${h}:${m}:${s}`;
        }

        // Render Loop for Running state
        setInterval(() => {
            if(bookingData && bookingData.status_countdown === 'running') {
                updateUI();
            }
        }, 1000);

    </script>
</body>
</html>
