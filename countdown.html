<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Monitor - PS3 HEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05050A;
            --text: #FFFFFF;
            --neon-blue: #00E5FF;
            --warning: #FFB800;
            --danger: #FF1F5A;
            --success: #00FF88;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at center, rgba(0, 229, 255, 0.05) 0%, transparent 60%);
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            font-family: 'Outfit', sans-serif;
        }
        
        .container { text-align: center; width: 100%; max-width: 1000px; padding: 40px; z-index: 2; }
        
        /* User Info Box */
        .header-info { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px 40px; 
            border-radius: 20px; 
            margin-bottom: 50px; 
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-info h2 { 
            color: var(--neon-blue); 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            font-weight: 900;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .header-info p { 
            font-size: 1.1rem; 
            color: #A0A0B0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Timer Display */
        .timer-box { position: relative; margin: 20px 0; }
        
        .timer { 
            font-family: 'Orbitron', sans-serif;
            font-size: 11vw; /* Responsive huge text */
            font-weight: 900; 
            line-height: 1;
            color: #FFFFFF; 
            text-shadow: 0 0 20px rgba(255,255,255,0.2), 0 0 50px rgba(0, 229, 255, 0.6); 
            transition: all 0.3s ease; 
        }
        
        .timer.warning { 
            color: var(--warning); 
            text-shadow: 0 0 30px rgba(255, 184, 0, 0.6), 0 0 60px rgba(255, 184, 0, 0.3); 
            animation: pulse-warn 2s infinite; 
        }
        
        .timer.danger { 
            color: var(--danger); 
            text-shadow: 0 0 30px rgba(255, 31, 90, 0.8), 0 0 80px rgba(255, 31, 90, 0.5); 
            animation: shake 0.4s infinite; 
        }
        
        /* Status Text */
        .status-text { 
            font-size: 2rem; 
            margin-top: 20px; 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            font-weight: 700;
            color: var(--neon-blue); 
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        /* TV Admin Message */
        .admin-note { 
            margin-top: 50px; 
            background: rgba(255, 31, 90, 0.08); 
            border: 1px solid rgba(255, 31, 90, 0.3);
            border-left: 6px solid var(--danger); 
            padding: 20px 30px; 
            text-align: left; 
            display: none; 
            border-radius: 8px;
            max-width: 700px;
            margin-left: auto; margin-right: auto;
            box-shadow: 0 10px 20px rgba(255, 31, 90, 0.1);
        }
        .admin-note h4 { color: var(--danger); margin-bottom: 8px; font-weight: 900; letter-spacing: 1px; font-size:1.1rem; }
        .admin-note p { font-size: 1.2rem; line-height: 1.5; }

        /* Initial Audio Unlock Overlay */
        #audioOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 5, 10, 0.95); z-index: 9999; 
            display: flex; align-items: center; justify-content: center; flex-direction: column; 
            backdrop-filter: blur(10px);
        }
        .btn-start { 
            padding: 20px 50px; font-size: 1.5rem; 
            background: linear-gradient(135deg, var(--neon-blue), #0088ff); 
            color: #000; border: none; border-radius: 12px; 
            font-weight: 900; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 2px; box-shadow: 0 10px 30px rgba(0, 229, 255, 0.4); 
            transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.05); }

        /* Animations */
        @keyframes pulse-warn {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -1px) rotate(-0.5deg); }
            20% { transform: translate(-2px, 0px) rotate(0.5deg); }
            30% { transform: translate(2px, 1px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(0.5deg); }
            50% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-0.5deg); }
            80% { transform: translate(-1px, -1px) rotate(0.5deg); }
            90% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(-0.5deg); }
        }
        
        @media (max-width: 800px) {
            .timer { font-size: 15vw; }
            .header-info { padding: 15px 20px; }
            .header-info h2 { font-size: 1.5rem; }
            .status-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="audioOverlay">
        <h2 style="color:white; margin-bottom:30px; font-weight:800; text-align:center; letter-spacing:2px;">SISTEM MONITOR TV AKTIF</h2>
        <button class="btn-start" onclick="initAudio()">Tampilkan Layar TV</button>
    </div>

    <div class="container">
        <div class="header-info" id="infoBox" style="display:none;">
            <h2 id="userName">MEMUAT DATA...</h2>
            <p><span id="bookingIdText" style="font-family:'Orbitron'">-</span> &nbsp;|&nbsp; <span id="packageName">-</span></p>
        </div>

        <div class="timer-box">
            <div class="timer" id="timerDisplay">00:00:00</div>
            <div class="status-text" id="statusDisplay">MENGHUBUNGKAN...</div>
        </div>

        <div class="admin-note" id="adminNoteBox">
            <h4>PESAN DARI ADMIN:</h4>
            <p id="adminNoteText"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5S1jEFxw_tGWHBVqGe_erZSsOKRK2gU",
            authDomain: "rental-ps3-hen.firebaseapp.com",
            databaseURL: "https://rental-ps3-hen-default-rtdb.firebaseio.com",
            projectId: "rental-ps3-hen",
            storageBucket: "rental-ps3-hen.firebasestorage.app",
            messagingSenderId: "209728877379",
            appId: "1:209728877379:web:3fcd356cc427c5172af5f6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Server Time Sync Logic (CRUCIAL FOR FIXING SYNC BUG)
        let serverOffset = 0;
        onValue(ref(db, '.info/serverTimeOffset'), (snap) => {
            serverOffset = snap.val() || 0;
        });
        function getTrueTime() {
            return Date.now() + serverOffset;
        }

        // Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('id');

        // Audio Synthesis 
        window.audioCtx = null;
        window.initAudio = function() {
            document.getElementById('audioOverlay').style.display = 'none';
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            osc.frequency.value = 1;
            osc.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(0.01);
        }

        function playBeep(type) {
            if(!window.audioCtx) return;
            const osc = window.audioCtx.createOscillator();
            const gain = window.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(window.audioCtx.destination);
            
            if(type === 'warning') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, window.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, window.audioCtx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, window.audioCtx.currentTime + 0.5);
                osc.stop(window.audioCtx.currentTime + 0.5);
            } else if(type === 'alarm') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, window.audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, window.audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, window.audioCtx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, window.audioCtx.currentTime + 1);
                osc.stop(window.audioCtx.currentTime + 1);
            }
        }

        // Timer Logic
        let bookingData = null;
        let warningPlayed = false;
        let alarmTriggered = false;
        let alarmInterval = null;

        if(!bookingId) {
            document.getElementById('statusDisplay').innerText = "LINK TIDAK VALID / KOSONG";
            document.getElementById('statusDisplay').style.color = "var(--danger)";
        } else {
            document.getElementById('infoBox').style.display = 'inline-block';
            document.getElementById('bookingIdText').innerText = bookingId;
            
            // Listen realtime from DB
            onValue(ref(db, `bookings/${bookingId}`), (snapshot) => {
                bookingData = snapshot.val();
                if(!bookingData) {
                    document.getElementById('statusDisplay').innerText = "DATA TIDAK DITEMUKAN";
                    document.getElementById('statusDisplay').style.color = "var(--danger)";
                    return;
                }
                
                document.getElementById('userName').innerText = bookingData.nama;
                document.getElementById('packageName').innerText = bookingData.paket_nama;
                
                // Notes Check
                if(bookingData.catatan_admin && bookingData.catatan_admin.trim() !== "") {
                    document.getElementById('adminNoteBox').style.display = 'block';
                    document.getElementById('adminNoteText').innerText = bookingData.catatan_admin;
                } else {
                    document.getElementById('adminNoteBox').style.display = 'none';
                }
                
                // Reset audio flags if time increases again (e.g. admin added time)
                let remCheck = calculateRemaining(bookingData);
                if(remCheck > 600000) warningPlayed = false;
                if(remCheck > 0) {
                    alarmTriggered = false;
                    clearInterval(alarmInterval);
                }
                
                updateUI();
            });
        }

        function calculateRemaining(b) {
            if (b.status_countdown === 'running') return b.waktu_selesai - getTrueTime(); // 100% Sync with server
            return b.sisa_waktu; // paused or idle
        }

        function updateUI() {
            if(!bookingData) return;
            
            const timerEl = document.getElementById('timerDisplay');
            const statusEl = document.getElementById('statusDisplay');
            
            let remTime = calculateRemaining(bookingData);
            
            // STATE: IDLE
            if (bookingData.status_countdown === 'idle') {
                statusEl.innerText = "SIAP DIMULAI";
                statusEl.style.color = "var(--neon-blue)";
                timerEl.className = "timer";
                timerEl.style.textShadow = "0 0 20px rgba(255,255,255,0.2), 0 0 50px rgba(0, 229, 255, 0.6)";
            } 
            // STATE: PAUSED
            else if (bookingData.status_countdown === 'paused') {
                statusEl.innerText = "PERMAINAN DI-JEDA";
                statusEl.style.color = "var(--warning)";
                timerEl.className = "timer"; // Remove shake/pulse if paused
                timerEl.style.color = "var(--warning)";
                timerEl.style.textShadow = "0 0 30px rgba(255, 184, 0, 0.6)";
            }
            // STATE: RUNNING
            else if (bookingData.status_countdown === 'running') {
                statusEl.innerText = "SEDANG BERMAIN";
                statusEl.style.color = "var(--success)";
                timerEl.className = "timer";
                timerEl.style.color = "#FFFFFF";
                timerEl.style.textShadow = "0 0 20px rgba(255,255,255,0.2), 0 0 50px rgba(0, 255, 136, 0.6)";
                
                // Audio Warnings
                if(remTime <= 600000 && remTime > 0 && !warningPlayed) {
                    playBeep('warning');
                    warningPlayed = true; 
                }
                
                // Visual Warnings (< 10 minutes)
                if(remTime <= 600000 && remTime > 0) {
                    statusEl.innerText = "SISA WAKTU < 10 MENIT!";
                    statusEl.style.color = "var(--warning)";
                    timerEl.className = "timer warning";
                }
            }
            // STATE: FINISHED manually
            else if (bookingData.status_countdown === 'finished') {
                statusEl.innerText = "WAKTU HABIS!";
                statusEl.style.color = "var(--danger)";
                timerEl.className = "timer danger";
                remTime = 0;
            }

            // STATE: TIME IS UP
            if(remTime <= 0 && bookingData.status_countdown === 'running') {
                statusEl.innerText = "WAKTU HABIS! SILAKAN HUBUNGI ADMIN";
                statusEl.style.color = "var(--danger)";
                timerEl.className = "timer danger";
                remTime = 0;
                
                if(!alarmTriggered) {
                    alarmTriggered = true;
                    // Play alarm repeatedly every 1.5 seconds
                    alarmInterval = setInterval(() => playBeep('alarm'), 1500);
                }
            }

            // Format Timer Text
            let totalSeconds = Math.max(0, Math.floor(remTime / 1000));
            let h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let s = (totalSeconds % 60).toString().padStart(2, '0');
            timerEl.innerText = `${h}:${m}:${s}`;
        }

        // Render Loop for Running state
        setInterval(() => {
            if(bookingData && bookingData.status_countdown === 'running') {
                updateUI();
            }
        }, 1000);

    </script>
</body>
</html>
