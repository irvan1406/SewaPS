<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 Live Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --primary: #00f3ff;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass: rgba(15, 23, 42, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg); 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            font-family: 'Poppins', sans-serif;
            background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.05), transparent 60%);
        }
        
        /* Glass Info Panel */
        .info-panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 5vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }
        .player-name { font-size: 2rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
        .pkg-info { font-size: 1.1rem; color: #94a3b8; margin-top: 5px; font-weight: 300; letter-spacing: 1px;}
        
        /* The Massive Timer */
        .timer-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
        .timer { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 12vw; 
            font-weight: 400; 
            line-height: 1;
            text-shadow: 0 0 30px var(--primary), 0 0 60px rgba(0, 243, 255, 0.5); 
            color: #ffffff; 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .timer.warning { color: var(--warning); text-shadow: 0 0 30px var(--warning), 0 0 60px rgba(245, 158, 11, 0.5); animation: pulseWarn 2s infinite; }
        .timer.danger { color: var(--danger); text-shadow: 0 0 30px var(--danger), 0 0 80px rgba(239, 68, 68, 0.8); animation: shake 0.5s infinite; }
        
        .status-badge {
            margin-top: 20px;
            padding: 8px 30px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            transition: all 0.3s;
        }

        /* Admin Direct Note */
        .admin-note {
            position: absolute;
            bottom: 40px;
            background: rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(5px);
            border-left: 6px solid var(--danger);
            padding: 20px 30px;
            border-radius: 0 10px 10px 0;
            text-align: left;
            max-width: 80%;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease;
        }
        .admin-note h4 { color: var(--danger); font-size: 1.2rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px;}
        .admin-note p { font-size: 1.5rem; font-weight: 600; color: white;}

        /* Audio Init Overlay */
        #audioOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-start { padding: 20px 50px; font-size: 1.5rem; font-family: 'Poppins'; background: transparent; border: 2px solid var(--primary); color: var(--primary); border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; }
        .btn-start:hover { background: var(--primary); color: #000; box-shadow: 0 0 40px rgba(0,243,255,0.6); transform: scale(1.05); }

        /* Keyframes */
        @keyframes pulseWarn { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.02); opacity: 0.8; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
        @keyframes slideIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <!-- Audio Permission Overlay -->
    <div id="audioOverlay">
        <h2 style="font-weight:300; letter-spacing:3px; margin-bottom:40px;">SISTEM MONITORING PS3</h2>
        <button class="btn-start" onclick="initAudio()">Tampilkan Layar TV</button>
    </div>

    <!-- Main UI -->
    <div class="info-panel" id="infoBox" style="display:none;">
        <div class="player-name" id="userName">Loading Data...</div>
        <div class="pkg-info">ID: <span id="bId">-</span> | <span id="bPkg">-</span></div>
    </div>

    <div class="timer-wrapper">
        <div class="timer" id="timeDisplay">00:00:00</div>
        <div class="status-badge" id="statusBadge">CONNECTING...</div>
    </div>

    <div class="admin-note" id="noteBox">
        <h4>⚠️ PESAN ADMIN SERVER</h4>
        <p id="noteText"></p>
    </div>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5S1jEFxw_tGWHBVqGe_erZSsOKRK2gU",
            authDomain: "rental-ps3-hen.firebaseapp.com",
            databaseURL: "https://rental-ps3-hen-default-rtdb.firebaseio.com",
            projectId: "rental-ps3-hen",
            storageBucket: "rental-ps3-hen.firebasestorage.app",
            messagingSenderId: "209728877379",
            appId: "1:209728877379:web:3fcd356cc427c5172af5f6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // SYNC SERVER TIME (CRITICAL FIX)
        let offset = 0;
        onValue(ref(db, '.info/serverTimeOffset'), snap => { offset = snap.val() || 0; });
        const getNow = () => Date.now() + offset;

        // URL Params
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('id');

        // Embedded Audio Engine
        window.audioCtx = null;
        window.initAudio = () => {
            document.getElementById('audioOverlay').style.display = 'none';
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator(); osc.connect(audioCtx.destination);
            osc.start(0); osc.stop(0.01);
        };

        const playSiren = (type) => {
            if(!window.audioCtx) return;
            const o = window.audioCtx.createOscillator(), g = window.audioCtx.createGain();
            o.connect(g); g.connect(window.audioCtx.destination);
            if(type === 'warn') {
                o.type = 'square'; o.frequency.setValueAtTime(600, window.audioCtx.currentTime);
                g.gain.setValueAtTime(0.05, window.audioCtx.currentTime);
                o.start(); g.gain.exponentialRampToValueAtTime(0.00001, window.audioCtx.currentTime + 0.3); o.stop(window.audioCtx.currentTime + 0.3);
            } else {
                o.type = 'sawtooth'; o.frequency.setValueAtTime(400, window.audioCtx.currentTime); o.frequency.linearRampToValueAtTime(800, window.audioCtx.currentTime + 0.4);
                g.gain.setValueAtTime(0.1, window.audioCtx.currentTime);
                o.start(); g.gain.exponentialRampToValueAtTime(0.00001, window.audioCtx.currentTime + 1); o.stop(window.audioCtx.currentTime + 1);
            }
        };

        // State Loop
        let bData = null;
        let warnFired = false, alarmFired = false, alarmInt = null;

        if(!bookingId) {
            document.getElementById('statusBadge').innerText = "INVALID ACCESS LINK";
            document.getElementById('statusBadge').style.borderColor = "var(--danger)";
            document.getElementById('statusBadge').style.color = "var(--danger)";
        } else {
            document.getElementById('infoBox').style.display = 'block';
            document.getElementById('bId').innerText = bookingId;
            
            onValue(ref(db, `bookings/${bookingId}`), (snap) => {
                bData = snap.val();
                if(!bData) return document.getElementById('statusBadge').innerText = "DATA DELETED / NOT FOUND";
                
                document.getElementById('userName').innerText = bData.nama;
                document.getElementById('bPkg').innerText = bData.paket_nama;
                
                if(bData.catatan_admin && bData.catatan_admin.trim() !== "") {
                    document.getElementById('noteBox').style.display = 'block';
                    document.getElementById('noteText').innerText = bData.catatan_admin;
                } else { document.getElementById('noteBox').style.display = 'none'; }
                
                // Reset states if time is manually added
                let remCheck = bData.status_countdown === 'running' ? (bData.waktu_selesai - getNow()) : bData.sisa_waktu;
                if(remCheck > 600000) warnFired = false;
                if(remCheck > 0) { alarmFired = false; clearInterval(alarmInt); }
            });
        }

        // Render Frame
        setInterval(() => {
            if(!bData) return;
            
            const tEl = document.getElementById('timeDisplay');
            const sEl = document.getElementById('statusBadge');
            
            let rem = bData.status_countdown === 'running' ? (bData.waktu_selesai - getNow()) : bData.sisa_waktu;
            
            // Set Base Colors
            document.body.style.backgroundImage = 'radial-gradient(circle at center, rgba(0, 243, 255, 0.05), transparent 60%)';
            sEl.style.color = 'var(--primary)'; sEl.style.borderColor = 'var(--primary)'; sEl.style.background = 'rgba(0, 243, 255, 0.1)';
            
            if(bData.status_countdown === 'idle') {
                sEl.innerText = "STANDBY MODE"; tEl.className = "timer";
            } 
            else if(bData.status_countdown === 'paused') {
                sEl.innerText = "SYSTEM PAUSED";
                sEl.style.color = 'var(--warning)'; sEl.style.borderColor = 'var(--warning)'; sEl.style.background = 'rgba(245, 158, 11, 0.1)';
                tEl.className = "timer warning";
                document.body.style.backgroundImage = 'radial-gradient(circle at center, rgba(245, 158, 11, 0.05), transparent 60%)';
            }
            else if(bData.status_countdown === 'running') {
                sEl.innerText = "PLAYING"; tEl.className = "timer";
                
                if(rem <= 600000 && rem > 0) {
                    sEl.innerText = "WARNING: < 10 MINUTES"; tEl.className = "timer warning";
                    sEl.style.color = 'var(--warning)'; sEl.style.borderColor = 'var(--warning)'; sEl.style.background = 'rgba(245, 158, 11, 0.1)';
                    document.body.style.backgroundImage = 'radial-gradient(circle at center, rgba(245, 158, 11, 0.1), transparent 60%)';
                    if(!warnFired) { playSiren('warn'); warnFired = true; }
                }
            }
            else if(bData.status_countdown === 'finished') { rem = 0; }

            if(rem <= 0 && (bData.status_countdown === 'running' || bData.status_countdown === 'finished')) {
                sEl.innerText = "TIME IS UP - CONTACT ADMIN";
                sEl.style.color = 'var(--danger)'; sEl.style.borderColor = 'var(--danger)'; sEl.style.background = 'rgba(239, 68, 68, 0.2)';
                tEl.className = "timer danger";
                document.body.style.backgroundImage = 'radial-gradient(circle at center, rgba(239, 68, 68, 0.15), transparent 60%)';
                rem = 0;
                if(!alarmFired && bData.status_countdown === 'running') {
                    alarmFired = true; alarmInt = setInterval(() => playSiren('alarm'), 1500);
                }
            }

            let sTot = Math.max(0, Math.floor(rem / 1000));
            let h = Math.floor(sTot / 3600).toString().padStart(2, '0');
            let m = Math.floor((sTot % 3600) / 60).toString().padStart(2, '0');
            let s = (sTot % 60).toString().padStart(2, '0');
            tEl.innerText = `${h}:${m}:${s}`;

        }, 100); // 100ms refresh rate for smooth numeric display
    </script>
</body>
</html>
