<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Teko:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0F172A; 
            --bg-panel: #1E293B; 
            --border: #334155; 
            --primary: #3B82F6; 
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            
            --c-red: #EF4444;
            --c-green: #10B981;
            --c-blue: #0EA5E9;
            --c-yellow: #F59E0B;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        /* Toast */
        #toastContainer { 
            position: fixed; 
            bottom: 24px; 
            right: 24px; 
            z-index: 10000; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .toast { 
            background: #0F172A; 
            border-left: 4px solid var(--primary); 
            padding: 16px 20px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            font-weight: 500; 
            border: 1px solid var(--border); 
            animation: slideIn 0.3s ease forwards; 
        }
        
        @keyframes slideIn { 
            from { transform: translateX(100%); } 
            to { transform: translateX(0); } 
        }

        /* Login Screen */
        #loginOverlay { 
            position: fixed; 
            inset: 0; 
            background: var(--bg-dark); 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .login-box { 
            background: var(--bg-panel); 
            padding: 40px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        
        .login-box h2 { 
            margin-bottom: 25px; 
            font-weight: 700; 
            color: #FFF; 
        }
        
        .login-box input { 
            width: 100%; 
            padding: 14px; 
            background: var(--bg-dark); 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            outline: none; 
        }
        
        .login-box button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        
        .login-box button:hover { 
            opacity: 0.9; 
        }

        /* Sidebar Layout */
        .sidebar { 
            width: 260px; 
            background: var(--bg-panel); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            position: fixed; 
            height: 100vh; 
            left: 0; 
            top: 0; 
        }
        
        .brand { 
            padding: 24px; 
            font-size: 1.4rem; 
            font-weight: 800; 
            border-bottom: 1px solid var(--border); 
            color: #FFF; 
        }
        
        .brand span { 
            color: var(--primary); 
        }
        
        .nav-menu { 
            padding: 20px 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            flex: 1; 
        }
        
        .nav-btn { 
            background: transparent; 
            color: var(--text-dim); 
            border: none; 
            padding: 12px 16px; 
            text-align: left; 
            font-size: 0.95rem; 
            font-weight: 500; 
            border-radius: 8px; 
            cursor: pointer; 
        }
        
        .nav-btn:hover { 
            background: var(--border); 
            color: white; 
        }
        
        .nav-btn.active { 
            background: rgba(59, 130, 246, 0.15); 
            color: var(--primary); 
            font-weight: 600; 
        }
        
        .logout-btn { 
            padding: 20px; 
            border-top: 1px solid var(--border); 
        }
        
        .logout-btn button { 
            width: 100%; 
            padding: 12px; 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--c-red); 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        /* Main Area */
        .main-content { 
            flex: 1; 
            margin-left: 260px; 
            padding: 40px; 
        }
        
        .section { 
            display: none; 
        }
        
        .section.active { 
            display: block; 
        }
        
        .header-title { 
            font-size: 1.8rem; 
            font-weight: 700; 
            margin-bottom: 24px; 
            color: #FFF; 
        }

        /* Filters */
        .filter-bar { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 24px; 
        }
        
        .filter-btn { 
            padding: 8px 16px; 
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            color: var(--text-dim); 
            font-size: 0.9rem; 
            font-weight: 500; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        
        .filter-btn.active { 
            background: var(--text-main); 
            color: var(--bg-dark); 
            border-color: var(--text-main); 
            font-weight: 600; 
        }

        /* List Layout untuk Booking (LEBIH RAPI DARI CARD) */
        .list-container { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        .list-item { 
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            border-left: 4px solid var(--border); 
        }
        
        .list-item.st-unpaid { border-left-color: var(--c-red); }
        .list-item.st-paid { border-left-color: var(--c-green); }
        .list-item.st-running { border-left-color: var(--c-blue); background: rgba(14, 165, 233, 0.05); }
        .list-item.st-paused { border-left-color: var(--c-yellow); }
        .list-item.st-finished { opacity: 0.6; }
        
        .item-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
        }
        
        .item-info h3 { 
            font-size: 1.2rem; 
            color: #FFF; 
            margin-bottom: 4px; 
        }
        
        .item-info p { 
            font-size: 0.85rem; 
            color: var(--text-dim); 
            display: flex; 
            gap: 12px; 
        }
        
        .badge { 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            background: rgba(255,255,255,0.1); 
        }
        
        .timer-display-admin { 
            font-size: 2.2rem; 
            font-weight: 700; 
            color: #FFF; 
            letter-spacing: 1px; 
            font-variant-numeric: tabular-nums; 
        }
        
        .item-actions { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            padding-top: 16px; 
            border-top: 1px solid var(--border); 
        }
        
        .btn-action { 
            padding: 8px 14px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            color: #FFF; 
        }
        
        .btn-action:hover { filter: brightness(1.1); }
        .b-green { background: var(--c-green); color: #000; }
        .b-red { background: var(--c-red); }
        .b-blue { background: var(--c-blue); color: #000; }
        .b-yellow { background: var(--c-yellow); color: #000; }
        .b-dark { background: #334155; }
        .b-outline { background: transparent; border: 1px solid var(--border); }

        /* Form Inputs */
        .crud-box { 
            background: var(--bg-panel); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-bottom: 24px; 
        }
        
        .crud-box input, .crud-box select, .crud-box textarea { 
            width: 100%; 
            padding: 12px; 
            background: var(--bg-dark); 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            outline: none; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: var(--bg-panel); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
        }
        
        th, td { 
            padding: 16px; 
            border-bottom: 1px solid var(--border); 
            text-align: left; 
        }
        
        th { 
            background: rgba(0,0,0,0.2); 
            color: var(--text-dim); 
            font-size: 0.85rem; 
            font-weight: 600; 
        }

        /* Modal */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.7); 
            backdrop-filter: blur(4px); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }
        
        .modal-content { 
            background: var(--bg-panel); 
            width: 100%; 
            max-width: 400px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
        }
        
        .modal-header { 
            padding: 20px; 
            border-bottom: 1px solid var(--border); 
            font-weight: 700; 
            font-size: 1.1rem; 
        }
        
        .modal-body { 
            padding: 20px; 
        }
        
        .modal-footer { 
            padding: 16px 20px; 
            border-top: 1px solid var(--border); 
            display: flex; 
            justify-content: flex-end; 
            gap: 8px; 
            background: var(--bg-dark); 
        }
        
        .modal-body input, .modal-body select, .modal-body textarea { 
            width: 100%; 
            padding: 12px; 
            background: var(--bg-dark); 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            outline: none; 
        }

        @media (max-width: 900px) {
            .sidebar { 
                transform: translateX(-100%); 
                transition: 0.3s; 
            }
            .main-content { 
                margin-left: 0; 
                padding: 20px; 
            }
        }
    </style>
</head>
<body>

    <div id="toastContainer"></div>
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Masukkan Password (admin123)">
            <button onclick="prosesLogin()">Masuk</button>
        </div>
    </div>

    <script>
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div'); 
            toast.className = 'toast';
            if(type === 'error') {
                toast.style.borderLeftColor = 'var(--c-red)';
            }
            toast.innerHTML = `<div>${msg}</div>`; 
            container.appendChild(toast);
            
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }
        
        function prosesLogin() {
            if(document.getElementById('adminPass').value === 'admin123') {
                localStorage.setItem('adm_log', 'true'); 
                document.getElementById('loginOverlay').style.display = 'none'; 
                showToast('Berhasil masuk');
            } else { 
                showToast('Password salah!', 'error'); 
            }
        }
        
        function prosesLogout() { 
            localStorage.removeItem('adm_log'); 
            location.reload(); 
        }
        
        if(localStorage.getItem('adm_log') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
        }
    </script>

    <div class="sidebar">
        <div class="brand">PS3 <span>PANEL</span></div>
        <div class="nav-menu">
            <button class="nav-btn active" data-target="dashboard">⚡ Monitor Live</button>
            <button class="nav-btn" data-target="packages">📦 Paket Harga</button>
            <button class="nav-btn" data-target="promos">🎁 Promo</button>
            <button class="nav-btn" data-target="history">📁 Riwayat</button>
            <button class="nav-btn" data-target="settings">⚙️ Setting TV</button>
        </div>
        <div class="logout-btn"><button onclick="prosesLogout()">Keluar</button></div>
    </div>

    <div class="main-content">
        <div id="dashboard" class="section active">
            <h1 class="header-title">Monitor Penyewaan</h1>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="unpaid">Belum Lunas</button>
                <button class="filter-btn" data-filter="paid">Lunas (Wait)</button>
                <button class="filter-btn" data-filter="running">Berjalan</button>
            </div>
            <div class="list-container" id="bookingGrid"></div>
        </div>

        <div id="history" class="section">
            <h1 class="header-title">Riwayat Selesai</h1>
            <div class="list-container" id="historyGrid"></div>
        </div>

        <div id="settings" class="section">
            <h1 class="header-title">Gaya Font Layar TV</h1>
            <div class="crud-box" style="max-width: 500px;">
                <label style="color:var(--text-dim); display:block; margin-bottom:10px;">Pilih Jenis Font Tampilan Angka TV</label>
                <select id="tvFontSelect">
                    <option value="'Orbitron', sans-serif">Orbitron (Modern Sci-Fi)</option>
                    <option value="'JetBrains Mono', monospace">JetBrains Mono (Hacker)</option>
                    <option value="'Share Tech Mono', monospace">Share Tech Mono (Digital Jam)</option>
                    <option value="'Teko', sans-serif">Teko (Tegas & Rapat)</option>
                </select>
                <button class="btn-action b-blue" id="btnSaveFont" style="width:100%; padding:12px;">Terapkan ke Layar TV</button>
            </div>
        </div>
    </div>

    <div id="modalWaktu" class="modal">
        <div class="modal-content">
            <div class="modal-header">Atur Waktu Manual</div>
            <div class="modal-body">
                <input type="hidden" id="mWaktuId">
                <select id="mWaktuMode">
                    <option value="add">Tambah (+) Menit Ke Sisa Waktu</option>
                    <option value="sub">Kurangi (-) Menit Dari Sisa Waktu</option>
                    <option value="set">Timpa Sisa Waktu (Reset Paksa)</option>
                </select>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="number" id="mJam" placeholder="Jam" value="0">
                    <input type="number" id="mMenit" placeholder="Menit" value="0">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-action b-outline" onclick="document.getElementById('modalWaktu').style.display='none'">Batal</button>
                <button class="btn-action b-blue" id="btnSaveWaktu">Simpan</button>
            </div>
        </div>
    </div>

    <div id="modalPesan" class="modal">
        <div class="modal-content">
            <div class="modal-header">Pesan TV</div>
            <div class="modal-body">
                <input type="hidden" id="mPesanId">
                <textarea id="mPesanTeks" rows="4" placeholder="Tuliskan peringatan atau pesan untuk penyewa..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-action b-outline" onclick="document.getElementById('modalPesan').style.display='none'">Batal</button>
                <button class="btn-action b-blue" id="btnSavePesan">Tampilkan di TV</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5S1jEFxw_tGWHBVqGe_erZSsOKRK2gU",
            authDomain: "rental-ps3-hen.firebaseapp.com",
            databaseURL: "https://rental-ps3-hen-default-rtdb.firebaseio.com",
            projectId: "rental-ps3-hen",
            storageBucket: "rental-ps3-hen.firebasestorage.app",
            messagingSenderId: "209728877379",
            appId: "1:209728877379:web:3fcd356cc427c5172af5f6"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Sinkronisasi Server Time
        let serverOffset = 0;
        onValue(ref(db, '.info/serverTimeOffset'), (snap) => { 
            serverOffset = snap.val() || 0; 
        });
        
        function getTrueTime() { 
            return Date.now() + serverOffset; 
        }

        let bookingsData = {};
        let currentFilter = 'all';
        let currentFont = "'Orbitron', sans-serif";

        // Logika Navigasi Tab
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                
                e.target.classList.add('active'); 
                document.getElementById(e.target.dataset.target).classList.add('active');
            });
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active'); 
                currentFilter = e.target.dataset.filter; 
                renderList();
            });
        });

        // Setting Font
        onValue(ref(db, 'settings/tv_font'), (snap) => { 
            if(snap.val()) { 
                currentFont = snap.val(); 
                document.getElementById('tvFontSelect').value = currentFont; 
            } 
        });
        
        document.getElementById('btnSaveFont').onclick = () => { 
            set(ref(db, 'settings/tv_font'), document.getElementById('tvFontSelect').value); 
            showToast('Font TV Diperbarui'); 
        };

        // Data Rendering Real-time
        onValue(ref(db, 'bookings'), (snap) => { 
            bookingsData = snap.val() || {}; 
            renderList(); 
        });

        function formatTime(ms) {
            if(ms <= 0) return "00:00:00";
            let s = Math.floor(ms / 1000);
            return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }

        // Timer Interval
        setInterval(() => {
            document.querySelectorAll('.timer-display-admin').forEach(el => {
                let b = bookingsData[el.dataset.id];
                if(b && b.status_countdown === 'running') {
                    let rem = b.waktu_selesai - getTrueTime();
                    el.innerText = rem <= 0 ? "00:00:00" : formatTime(rem);
                    el.style.color = rem <= 600000 && rem > 0 ? 'var(--c-yellow)' : (rem <= 0 ? 'var(--c-red)' : '#FFF');
                }
            });
        }, 1000);

        function renderList() {
            const grid = document.getElementById('bookingGrid'); 
            const history = document.getElementById('historyGrid');
            
            grid.innerHTML = ''; 
            history.innerHTML = '';
            
            let sortedIds = Object.keys(bookingsData).sort((a,b) => parseInt(b.split('-')[1] || 0) - parseInt(a.split('-')[1] || 0));

            sortedIds.forEach(id => {
                let b = bookingsData[id]; 
                let rem = (b.status_countdown === 'running') ? b.waktu_selesai - getTrueTime() : b.sisa_waktu;
                let cClass = 'st-unpaid'; 
                let sText = 'Belum Lunas';
                
                if(b.status_pembayaran === 'Sudah Bayar') { 
                    cClass = 'st-paid'; 
                    sText = b.status_konfirmasi === 'Sudah' ? 'Siap Main' : 'Lunas (Menunggu)'; 
                }
                if(b.status_countdown === 'running') { 
                    cClass = 'st-running'; 
                    sText = 'Sedang Main'; 
                }
                if(b.status_countdown === 'paused') { 
                    cClass = 'st-paused'; 
                    sText = 'Di-jeda'; 
                }
                if(b.status_countdown === 'finished' || (rem <= 0 && b.status_countdown === 'running')) { 
                    cClass = 'st-finished'; 
                    sText = 'Waktu Habis'; 
                }

                let html = `
                <div class="list-item ${cClass}">
                    <div class="item-header">
                        <div class="item-info">
                            <h3>${b.nama} <span class="badge">${b.paket_nama}</span></h3>
                            <p><span>ID: ${id}</span> <span>${b.metode_pembayaran}</span> <span style="color: var(--primary)">[ ${sText} ]</span></p>
                        </div>
                        <div class="timer-display-admin" data-id="${id}" style="font-family: ${currentFont}">${formatTime(rem)}</div>
                    </div>
                    <div class="item-actions">
                        ${b.is_history ? `
                            <button class="btn-action b-red" data-action="delete" data-id="${id}">Hapus Riwayat</button>
                        ` : `
                            ${b.status_pembayaran === 'Belum Bayar' ? `<button class="btn-action b-green" data-action="bayar" data-id="${id}">Terima Pembayaran</button>` : (b.status_konfirmasi === 'Belum' ? `<button class="btn-action b-blue" data-action="konfirmasi" data-id="${id}">Konfirmasi Unit</button>` : '')}
                            ${b.status_konfirmasi === 'Sudah' && b.status_countdown !== 'running' ? `<button class="btn-action b-green" data-action="start" data-id="${id}">▶ PLAY</button>` : ''}
                            ${b.status_countdown === 'running' ? `<button class="btn-action b-yellow" data-action="pause" data-id="${id}">⏸ PAUSE</button>` : ''}
                            <button class="btn-action b-dark" data-action="waktu" data-id="${id}">⏱ Waktu</button>
                            <button class="btn-action b-dark" data-action="pesan" data-id="${id}">💬 Pesan</button>
                            <button class="btn-action b-outline" data-action="copylink" data-id="${id}">🔗 Link TV</button>
                            <button class="btn-action b-outline" data-action="reset" data-id="${id}">↺ Reset</button>
                            <button class="btn-action b-outline" data-action="finish" data-id="${id}">🏁 Selesai</button>
                            <button class="btn-action b-red" data-action="delete" data-id="${id}">Hapus</button>
                        `}
                    </div>
                </div>`;

                if(b.is_history) {
                    history.innerHTML += html;
                } else {
                    let show = (currentFilter === 'all') || 
                               (currentFilter === 'unpaid' && b.status_pembayaran === 'Belum Bayar') ||
                               (currentFilter === 'paid' && b.status_pembayaran === 'Sudah Bayar' && b.status_countdown !== 'running') ||
                               (currentFilter === 'running' && b.status_countdown === 'running');
                    if(show) {
                        grid.innerHTML += html;
                    }
                }
            });
        }

        // EVENT DELEGATION: SOLUSI TOMBOL ADMIN BISA DIKLIK
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('.btn-action');
            if(!btn) return;
            
            const id = btn.getAttribute('data-id');
            const action = btn.getAttribute('data-action');
            if(!id || !action) return;

            let b = bookingsData[id]; 
            let up = {}; 
            let now = getTrueTime();

            if(action === 'bayar') { 
                up['status_pembayaran'] = 'Sudah Bayar'; 
                showToast('Status Lunas'); 
            }
            if(action === 'konfirmasi') { 
                up['status_konfirmasi'] = 'Sudah'; 
                showToast('Terkonfirmasi'); 
            }
            if(action === 'start') {
                if(b.status_pembayaran !== 'Sudah Bayar' || b.status_konfirmasi !== 'Sudah') {
                    return showToast('Belum lunas/dikonfirmasi!', 'error');
                }
                let rem = (b.status_countdown === 'idle' || b.status_countdown === 'paused') ? b.sisa_waktu : 0;
                if(rem <= 0) {
                    return showToast('Waktu 0, tambah manual.', 'error');
                }
                up['status_countdown'] = 'running'; 
                up['waktu_selesai'] = now + rem; 
                showToast('Mulai Bermain!');
            }
            if(action === 'pause') { 
                up['status_countdown'] = 'paused'; 
                up['sisa_waktu'] = Math.max(0, b.waktu_selesai - now); 
                showToast('Di-jeda'); 
            }
            if(action === 'reset') { 
                up['status_countdown'] = 'idle'; 
                up['sisa_waktu'] = b.durasi_jam * 3600000; 
                up['waktu_selesai'] = 0; 
                showToast('Direset'); 
            }
            if(action === 'finish') { 
                up['is_history'] = true; 
                up['status_countdown'] = 'finished'; 
                showToast('Diarsipkan'); 
            }
            if(action === 'delete') { 
                if(confirm(`Yakin hapus data ini?`)) { 
                    await remove(ref(db, `bookings/${id}`)); 
                    showToast('Terhapus'); 
                    return; 
                } 
            }
            if(action === 'copylink') {
                let url = window.location.origin + window.location.pathname.replace('admin.html', 'countdown.html') + '?id=' + id;
                navigator.clipboard.writeText(url); 
                showToast('Link TV Tercopy'); 
                return;
            }
            if(action === 'waktu') {
                document.getElementById('mWaktuId').value = id; 
                document.getElementById('mJam').value = 0; 
                document.getElementById('mMenit').value = 0;
                document.getElementById('modalWaktu').style.display = 'flex'; 
                return;
            }
            if(action === 'pesan') {
                document.getElementById('mPesanId').value = id; 
                document.getElementById('mPesanTeks').value = b.catatan_admin || "";
                document.getElementById('modalPesan').style.display = 'flex'; 
                return;
            }

            if(Object.keys(up).length > 0) {
                await update(ref(db, `bookings/${id}`), up);
            }
        });

        // Proses Penyimpanan Modal Waktu Edit
        document.getElementById('btnSaveWaktu').onclick = async () => {
            let id = document.getElementById('mWaktuId').value; 
            let b = bookingsData[id];
            
            let ms = ((parseInt(document.getElementById('mJam').value)||0)*3600 + (parseInt(document.getElementById('mMenit').value)||0)*60) * 1000;
            let now = getTrueTime(); 
            let cur = (b.status_countdown === 'running') ? (b.waktu_selesai - now) : b.sisa_waktu;
            let mode = document.getElementById('mWaktuMode').value;
            
            let nSisa = mode === 'set' ? ms : (mode === 'add' ? cur + ms : Math.max(0, cur - ms));
            let up = {};
            
            if(b.status_countdown === 'running') { 
                up['waktu_selesai'] = now + nSisa; 
                up['sisa_waktu'] = nSisa; 
            } else { 
                up['sisa_waktu'] = nSisa; 
                if(b.status_countdown === 'finished') {
                    up['status_countdown'] = 'paused'; 
                }
            }
            
            await update(ref(db, `bookings/${id}`), up); 
            document.getElementById('modalWaktu').style.display = 'none'; 
            showToast("Waktu Disesuaikan");
        };

        // Proses Penyimpanan Modal Pesan TV
        document.getElementById('btnSavePesan').onclick = async () => {
            await update(ref(db, `bookings/${document.getElementById('mPesanId').value}`), { 
                catatan_admin: document.getElementById('mPesanTeks').value 
            });
            document.getElementById('modalPesan').style.display = 'none'; 
            showToast("Pesan Naik ke TV");
        };

    </script>
</body>
</html>
