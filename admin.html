<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS3 Admin Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel: #1e293b;
            --panel-hover: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-light); padding-top: 70px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* Navbar */
        nav { position: fixed; top: 0; width: 100%; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border); z-index: 100; }
        .brand { font-size: 1.2rem; font-weight: 700; color: var(--primary); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { background: transparent; color: var(--text-dim); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.3s; }
        .nav-btn:hover { background: var(--panel-hover); color: var(--text-light); }
        .nav-btn.active { background: var(--primary); color: white; }
        .btn-logout { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-logout:hover { background: var(--danger); color: white; }

        /* Layout & Sections */
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        .section-header { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: var(--text-light); }

        /* Filters */
        .filter-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; background: var(--panel); padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); }
        .filter-tab { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; border: none; background: transparent; color: var(--text-dim); }
        .filter-tab.active { background: var(--border); color: var(--text-light); }

        /* Grid & Cards */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        .booking-card { background: var(--panel); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: transform 0.2s; }
        .booking-card:hover { border-color: #475569; }
        
        .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .b-name { font-weight: 600; font-size: 1.1rem; color: white; }
        .b-pkg { font-size: 0.8rem; background: var(--bg-dark); padding: 4px 10px; border-radius: 20px; color: var(--text-dim); margin-top: 5px; display: inline-block; border: 1px solid var(--border); }
        
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .status-badge::before { content:''; width: 8px; height: 8px; border-radius: 50%; }
        
        /* Status Colors */
        .st-unpaid .status-badge { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .st-unpaid .status-badge::before { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .st-paid .status-badge { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .st-paid .status-badge::before { background: var(--success); }
        .st-running { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
        .st-running .status-badge { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .st-running .status-badge::before { background: var(--primary); box-shadow: 0 0 8px var(--primary); animation: blink 1s infinite; }
        .st-paused .status-badge { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .st-paused .status-badge::before { background: var(--warning); }
        .st-finished .status-badge { background: rgba(148, 163, 184, 0.1); color: var(--text-dim); }
        .st-finished .status-badge::before { background: var(--text-dim); }

        .b-details { font-size: 0.85rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .b-row { display: flex; justify-content: space-between; }
        .b-row span:last-child { font-weight: 500; color: #e2e8f0; }

        .timer-huge { font-family: 'Courier New', monospace; font-size: 2.2rem; font-weight: 700; text-align: center; margin: 15px 0; letter-spacing: 2px; color: var(--text-light); }
        .timer-warning { color: var(--warning); }
        .timer-danger { color: var(--danger); }

        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: auto; }
        .btn-grid.full { grid-template-columns: 1fr; }
        .btn-action { padding: 8px 0; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; color: white; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-action:hover { opacity: 0.8; }
        .bg-blue { background: var(--primary); }
        .bg-green { background: var(--success); }
        .bg-yellow { background: var(--warning); color: #000; }
        .bg-red { background: var(--danger); }
        .bg-gray { background: var(--panel-hover); }

        /* Login Screen */
        .auth-wrapper { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: var(--panel); padding: 40px; border-radius: var(--radius); border: 1px solid var(--border); width: 100%; max-width: 360px; text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin: 20px 0; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 6px; color: white; outline: none; }
        .auth-box button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; }

        /* CRUD Forms & Tables */
        .admin-form { background: var(--panel); padding: 25px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.8rem; color: var(--text-dim); }
        .admin-form input, .admin-form select, .admin-form textarea { padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; outline: none; }
        .admin-form textarea { grid-column: 1 / -1; min-height: 80px; resize: vertical; }
        .table-wrap { overflow-x: auto; background: var(--panel); border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.2); padding: 15px; font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid var(--border); font-size: 0.9rem; }
        
        /* Modals Reusable */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: zoomIn 0.2s; }
        .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; color: white; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .input-box { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); color: white; border-radius: 6px; margin-bottom: 10px; outline:none;}
        
        /* Time Adjust Grid */
        .time-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .time-inputs > div { flex: 1; text-align: center; }
        .time-inputs label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
        .time-inputs input { width: 100%; text-align: center; font-size: 1.2rem; padding: 10px; }

        /* Toast */
        .toast { position: fixed; top: 20px; right: -300px; background: var(--panel); border-left: 4px solid var(--primary); padding: 15px 25px; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: right 0.3s; z-index: 3000; display: flex; align-items: center; gap: 10px; }
        .toast.show { right: 20px; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Auth -->
    <div id="authScreen" class="auth-wrapper">
        <div class="auth-box">
            <div style="font-size: 2rem; margin-bottom: 10px;">🔐</div>
            <h2 style="color:var(--text-light)">Admin Security</h2>
            <input type="password" id="passInput" placeholder="Enter Password" autocomplete="off">
            <button onclick="handleLogin()">Access Dashboard</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="brand">🎮 PS3 CONTROL</div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="dash">Live Board</button>
            <button class="nav-btn" data-target="pkg">Packages</button>
            <button class="nav-btn" data-target="prm">Promos</button>
            <button class="nav-btn" data-target="hist">History</button>
            <button class="nav-btn btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <!-- Live Dashboard -->
        <div id="dash" class="section active">
            <h2 class="section-header">Live Active Bookings</h2>
            <div class="filter-group">
                <button class="filter-tab active" data-f="all">All Status</button>
                <button class="filter-tab" data-f="unpaid">Belum Bayar</button>
                <button class="filter-tab" data-f="paid">Standby / Paid</button>
                <button class="filter-tab" data-f="running">Running</button>
                <button class="filter-tab" data-f="finished">Finished</button>
            </div>
            <div class="grid-container" id="liveGrid"></div>
        </div>

        <!-- History -->
        <div id="hist" class="section">
            <h2 class="section-header">Rental History</h2>
            <div class="grid-container" id="historyGrid"></div>
        </div>

        <!-- Packages Management -->
        <div id="pkg" class="section">
            <h2 class="section-header">Paket & Harga</h2>
            <div class="admin-form">
                <input type="hidden" id="fPkgId">
                <div class="input-group"><label>Nama Paket</label><input type="text" id="fPkgName"></div>
                <div class="input-group"><label>Durasi (Jam)</label><input type="number" id="fPkgDur" step="0.5"></div>
                <div class="input-group"><label>Harga (Rp)</label><input type="number" id="fPkgPrice"></div>
                <div class="input-group"><label>Status</label>
                    <select id="fPkgActive"><option value="true">Aktif</option><option value="false">Nonaktif</option></select>
                </div>
                <div class="input-group" style="grid-column: 1 / -1;"><label>Keterangan</label><textarea id="fPkgDesc"></textarea></div>
                <button class="btn-action bg-blue" style="grid-column: 1 / -1; padding: 12px;" onclick="savePkg()">Simpan Data Paket</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Paket</th><th>Durasi</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead>
                    <tbody id="tblPkg"></tbody>
                </table>
            </div>
        </div>

        <!-- Promos Management -->
        <div id="prm" class="section">
            <h2 class="section-header">Promo Aktif</h2>
            <div class="admin-form">
                <input type="hidden" id="fPrmId">
                <div class="input-group"><label>Judul Promo</label><input type="text" id="fPrmTitle"></div>
                <div class="input-group"><label>Label Diskon</label><input type="text" id="fPrmDisc" placeholder="Cth: Cashback 50%"></div>
                <div class="input-group"><label>Status</label>
                    <select id="fPrmActive"><option value="true">Aktif</option><option value="false">Nonaktif</option></select>
                </div>
                <div class="input-group" style="grid-column: 1 / -1;"><label>Syarat / Keterangan</label><textarea id="fPrmDesc"></textarea></div>
                <button class="btn-action bg-blue" style="grid-column: 1 / -1; padding: 12px;" onclick="savePrm()">Simpan Promo</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Promo</th><th>Label Diskon</th><th>Status</th><th>Aksi</th></tr></thead>
                    <tbody id="tblPrm"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modals -->

    <!-- Modal: Confirmation (Replaces window.confirm) -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="confTitle">Konfirmasi</div>
            <p style="color:var(--text-dim); margin-bottom: 20px;" id="confMsg">Anda yakin ingin melanjutkan?</p>
            <div class="modal-footer">
                <button class="btn-action bg-gray" style="padding:8px 20px" onclick="closeModals()">Batal</button>
                <button class="btn-action bg-red" style="padding:8px 20px" id="confBtn">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- Modal: Admin Note -->
    <div id="noteModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">Catatan Layar Penyewa</div>
            <input type="hidden" id="nBookId">
            <textarea class="input-box" id="nText" rows="4" placeholder="Ketik pesan yang akan tampil di layar TV penyewa..."></textarea>
            <div class="modal-footer">
                <button class="btn-action bg-gray" style="padding:8px 20px" onclick="closeModals()">Batal</button>
                <button class="btn-action bg-blue" style="padding:8px 20px" onclick="submitNote()">Tampilkan</button>
            </div>
        </div>
    </div>

    <!-- Modal: Manual Time Adjust -->
    <div id="timeModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">Atur Waktu Manual</div>
            <input type="hidden" id="tBookId">
            <div class="time-inputs">
                <div><label>Jam</label><input type="number" id="tHours" class="input-box" value="0" min="0"></div>
                <div><label>Menit</label><input type="number" id="tMins" class="input-box" value="30" min="0"></div>
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button class="btn-action bg-red" style="padding:10px 20px; width:48%" onclick="submitTimeAdjust('sub')">(-) Kurangi</button>
                <button class="btn-action bg-green" style="padding:10px 20px; width:48%" onclick="submitTimeAdjust('add')">(+) Tambah</button>
            </div>
            <div class="modal-footer" style="margin-top:10px;">
                <button class="btn-action bg-gray" style="width:100%; padding:10px;" onclick="closeModals()">Batal</button>
            </div>
        </div>
    </div>

    <!-- Global Toast -->
    <div id="toast" class="toast">Action Success</div>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5S1jEFxw_tGWHBVqGe_erZSsOKRK2gU",
            authDomain: "rental-ps3-hen.firebaseapp.com",
            databaseURL: "https://rental-ps3-hen-default-rtdb.firebaseio.com",
            projectId: "rental-ps3-hen",
            storageBucket: "rental-ps3-hen.firebasestorage.app",
            messagingSenderId: "209728877379",
            appId: "1:209728877379:web:3fcd356cc427c5172af5f6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Auth Setup ---
        window.handleLogin = () => {
            if(document.getElementById('passInput').value === 'admin123') {
                localStorage.setItem('ps3_adm_token', 'true');
                document.getElementById('authScreen').style.display = 'none';
                showToast("Login Berhasil", "green");
            } else { showToast("Password Salah!", "red"); }
        };
        window.handleLogout = () => { localStorage.removeItem('ps3_adm_token'); location.reload(); };
        if(localStorage.getItem('ps3_adm_token') === 'true') document.getElementById('authScreen').style.display = 'none';

        // --- Core Utils ---
        window.closeModals = () => document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        window.showToast = (msg, color = 'var(--primary)') => {
            const t = document.getElementById('toast');
            t.style.borderLeftColor = color; t.innerText = msg;
            t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
        };
        
        let confirmAction = null;
        window.askConfirm = (title, msg, callback) => {
            document.getElementById('confTitle').innerText = title;
            document.getElementById('confMsg').innerText = msg;
            confirmAction = callback;
            document.getElementById('confirmModal').style.display = 'flex';
        };
        document.getElementById('confBtn').onclick = () => { if(confirmAction) confirmAction(); window.closeModals(); };

        // --- Navigation & Filters ---
        let currentFilter = 'all';
        document.querySelectorAll('.nav-btn:not(.btn-logout)').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(e.target.dataset.target).classList.add('active');
            }
        });
        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active'); currentFilter = e.target.dataset.f;
                renderBookings();
            }
        });

        // --- TIME SYNC LOGIC (CRITICAL BUG FIX) ---
        // Menjamin waktu sisa presisi meskipun jam laptop admin/penyewa ngawur.
        let serverTimeOffset = 0;
        onValue(ref(db, '.info/serverTimeOffset'), (snap) => { serverTimeOffset = snap.val() || 0; });
        const getNow = () => Date.now() + serverTimeOffset;

        // --- Render Data ---
        let bookingsData = {};
        onValue(ref(db, 'bookings'), (snap) => { bookingsData = snap.val() || {}; renderBookings(); });

        const fmtTime = (ms) => {
            if(ms <= 0) return "00:00:00";
            let s = Math.floor(ms / 1000);
            let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        };

        const calcRem = (b) => (b.status_countdown === 'running') ? (b.waktu_selesai - getNow()) : b.sisa_waktu;

        setInterval(() => {
            document.querySelectorAll('.timer-huge').forEach(el => {
                let b = bookingsData[el.dataset.id];
                if(b && b.status_countdown === 'running') {
                    let rem = b.waktu_selesai - getNow();
                    if(rem <= 0) { el.innerText = "00:00:00"; el.className = "timer-huge timer-danger"; }
                    else {
                        el.innerText = fmtTime(rem);
                        el.className = "timer-huge " + (rem <= 600000 ? "timer-warning" : "");
                    }
                }
            });
        }, 1000);

        function renderBookings() {
            const live = document.getElementById('liveGrid'); const hist = document.getElementById('historyGrid');
            live.innerHTML = ''; hist.innerHTML = '';

            Object.keys(bookingsData).forEach(id => {
                let b = bookingsData[id];
                let rem = calcRem(b);
                let tClass = "timer-huge" + (rem <= 0 ? " timer-danger" : (rem <= 600000 && b.status_countdown === 'running' ? " timer-warning" : ""));
                
                let cClass = 'st-unpaid', sText = 'BELUM BAYAR';
                if(b.status_pembayaran === 'Sudah Bayar') { cClass = 'st-paid'; sText = b.status_konfirmasi === 'Sudah' ? 'STANDBY' : 'MENUNGGU KONFIRM'; }
                if(b.status_countdown === 'running') { cClass = 'st-running'; sText = 'PLAYING'; }
                if(b.status_countdown === 'paused') { cClass = 'st-paused'; sText = 'PAUSED'; }
                if(b.status_countdown === 'finished') { cClass = 'st-finished'; sText = 'TIME UP'; }

                let card = `
                    <div class="booking-card ${cClass}">
                        <div class="card-head">
                            <div><div class="b-name">${b.nama}</div><div class="b-pkg">${b.paket_nama}</div></div>
                            <div class="status-badge">${sText}</div>
                        </div>
                        <div class="b-details">
                            <div class="b-row"><span>Booking ID:</span> <span>${id}</span></div>
                            <div class="b-row"><span>WhatsApp:</span> <span>${b.nohp}</span></div>
                            <div class="b-row"><span>Metode:</span> <span>${b.metode_pembayaran}</span></div>
                        </div>
                        <div class="timer-huge" data-id="${id}">${fmtTime(rem)}</div>
                        
                        ${b.is_history ? `
                            <div class="btn-grid full"><button class="btn-action bg-red" onclick="delBook('${id}')">Hapus Permanen</button></div>
                        ` : `
                            <div class="btn-grid" style="margin-bottom:8px">
                                ${b.status_pembayaran === 'Belum Bayar' 
                                    ? `<button class="btn-action bg-green" onclick="act('${id}','pay')">✓ Lunas</button>` 
                                    : (b.status_konfirmasi === 'Belum' 
                                        ? `<button class="btn-action bg-blue" onclick="act('${id}','conf')">Konfirmasi</button>` : '')}
                                
                                ${b.status_konfirmasi === 'Sudah' && b.status_countdown !== 'running' ? `<button class="btn-action bg-blue" onclick="act('${id}','start')">▶ START</button>` : ''}
                                ${b.status_countdown === 'running' ? `<button class="btn-action bg-yellow" onclick="act('${id}','pause')">⏸ PAUSE</button>` : ''}
                            </div>
                            <div class="btn-grid">
                                <button class="btn-action bg-gray" onclick="openTimeAdjust('${id}')">± Waktu</button>
                                <button class="btn-action bg-gray" onclick="openNoteModal('${id}')">💬 Catatan</button>
                                <button class="btn-action bg-gray" onclick="copyL('${id}')">📋 Link</button>
                                <button class="btn-action bg-gray" onclick="act('${id}','reset')">↺ Reset</button>
                                <button class="btn-action bg-gray" onclick="act('${id}','finish')">📦 Selesai</button>
                                <button class="btn-action bg-red" onclick="delBook('${id}')">🗑 Hapus</button>
                            </div>
                        `}
                    </div>`;

                if(b.is_history) { hist.innerHTML += card; }
                else {
                    let show = (currentFilter === 'all') || 
                               (currentFilter === 'unpaid' && b.status_pembayaran === 'Belum Bayar') ||
                               (currentFilter === 'paid' && b.status_pembayaran === 'Sudah Bayar' && b.status_countdown !== 'running') ||
                               (currentFilter === 'running' && b.status_countdown === 'running') ||
                               (currentFilter === 'finished' && b.status_countdown === 'finished');
                    if(show) live.innerHTML += card;
                }
            });
        }

        // --- Actions Logic ---
        window.act = async (id, cmd) => {
            let b = bookingsData[id]; let u = {};
            if(cmd === 'pay') { u.status_pembayaran = 'Sudah Bayar'; showToast("Pembayaran Diterima"); }
            if(cmd === 'conf') { u.status_konfirmasi = 'Sudah'; showToast("Sewa Dikonfirmasi"); }
            if(cmd === 'start') {
                if(b.status_pembayaran !== 'Sudah Bayar' || b.status_konfirmasi !== 'Sudah') return showToast("Selesaikan pembayaran & konfirmasi dulu!","red");
                let rem = (b.status_countdown === 'idle' || b.status_countdown === 'paused') ? b.sisa_waktu : 0;
                if(rem <= 0) return showToast("Waktu habis! Tambah waktu dulu.", "red");
                u.status_countdown = 'running'; u.waktu_selesai = getNow() + rem; showToast("Timer Dimulai", "var(--success)");
            }
            if(cmd === 'pause') {
                u.status_countdown = 'paused'; u.sisa_waktu = Math.max(0, b.waktu_selesai - getNow()); showToast("Timer Dijeda", "var(--warning)");
            }
            if(cmd === 'reset') {
                u.status_countdown = 'idle'; u.sisa_waktu = b.durasi_jam * 3600000; u.waktu_selesai = 0; showToast("Timer Direset");
            }
            if(cmd === 'finish') {
                window.askConfirm("Selesaikan Sewa?", "Data akan dipindah ke Riwayat Selesai.", async () => {
                    await update(ref(db, `bookings/${id}`), { is_history: true, status_countdown: 'finished' });
                    showToast("Pindah ke Riwayat");
                }); return;
            }
            if(Object.keys(u).length > 0) await update(ref(db, `bookings/${id}`), u);
        };

        window.delBook = (id) => {
            window.askConfirm("Hapus Permanen?", "Data booking ini akan hilang selamanya.", async () => {
                await remove(ref(db, `bookings/${id}`)); showToast("Data Terhapus", "var(--danger)");
            });
        };

        window.copyL = (id) => {
            let link = window.location.origin + window.location.pathname.replace('admin.html', 'countdown.html') + '?id=' + id;
            navigator.clipboard.writeText(link).then(() => showToast("Link Layar Tercopy!"));
        };

        // --- Custom Time Adjust Logic ---
        window.openTimeAdjust = (id) => {
            document.getElementById('tBookId').value = id;
            document.getElementById('tHours').value = '0';
            document.getElementById('tMins').value = '30';
            document.getElementById('timeModal').style.display = 'flex';
        };
        window.submitTimeAdjust = async (type) => {
            let id = document.getElementById('tBookId').value;
            let h = parseInt(document.getElementById('tHours').value) || 0;
            let m = parseInt(document.getElementById('tMins').value) || 0;
            let ms = (h * 3600 + m * 60) * 1000;
            if(ms === 0) return;

            let b = bookingsData[id];
            let u = {};
            if(b.status_countdown === 'running') {
                u.waktu_selesai = type === 'add' ? (b.waktu_selesai + ms) : (b.waktu_selesai - ms);
            } else {
                u.sisa_waktu = type === 'add' ? (b.sisa_waktu + ms) : Math.max(0, b.sisa_waktu - ms);
                if(b.status_countdown === 'finished' && type === 'add') u.status_countdown = 'paused';
            }
            await update(ref(db, `bookings/${id}`), u);
            window.closeModals();
            showToast(`Waktu berhasil di${type === 'add'?'tambah':'kurangi'}`);
        };

        // --- Admin Notes ---
        window.openNoteModal = (id) => {
            document.getElementById('nBookId').value = id;
            document.getElementById('nText').value = bookingsData[id].catatan_admin || '';
            document.getElementById('noteModal').style.display = 'flex';
        };
        window.submitNote = async () => {
            let id = document.getElementById('nBookId').value;
            await update(ref(db, `bookings/${id}`), { catatan_admin: document.getElementById('nText').value });
            window.closeModals(); showToast("Catatan Tampil di Layar");
        };

        // --- CRUD Master Data ---
        const resetFP = () => { ['Id','Name','Dur','Price','Desc'].forEach(k => document.getElementById('fPkg'+k).value=''); };
        window.savePkg = async () => {
            let id = document.getElementById('fPkgId').value, n = document.getElementById('fPkgName').value;
            if(!n) return showToast("Nama paket wajib isi!", "red");
            let d = { name: n, duration_hours: parseFloat(document.getElementById('fPkgDur').value)||0, price: parseFloat(document.getElementById('fPkgPrice').value)||0, description: document.getElementById('fPkgDesc').value, is_active: document.getElementById('fPkgActive').value==='true' };
            if(id) await update(ref(db, `packages/${id}`), d); else await push(ref(db, 'packages'), d);
            resetFP(); showToast("Paket Tersimpan");
        };
        window.editP = (id,o) => { document.getElementById('fPkgId').value = id; document.getElementById('fPkgName').value = o.name; document.getElementById('fPkgDur').value = o.duration_hours; document.getElementById('fPkgPrice').value = o.price; document.getElementById('fPkgDesc').value = o.description; document.getElementById('fPkgActive').value = o.is_active?'true':'false'; };
        window.delP = (id) => window.askConfirm("Hapus Paket?", "", async () => { await remove(ref(db,`packages/${id}`)); showToast("Terhapus"); });
        onValue(ref(db,'packages'), s => {
            let d = s.val()||{}, h='';
            for(let k in d) h += `<tr><td>${d[k].name}</td><td>${d[k].duration_hours}h</td><td>Rp ${d[k].price}</td><td>${d[k].is_active?'✅':'❌'}</td><td><button class="btn-action bg-blue" onclick='editP("${k}",${JSON.stringify(d[k])})' style="padding:4px 10px; display:inline">Edit</button> <button class="btn-action bg-red" onclick='delP("${k}")' style="padding:4px 10px; display:inline">Del</button></td></tr>`;
            document.getElementById('tblPkg').innerHTML = h;
        });

        // Promos identical logic...
        const resetFPr = () => { ['Id','Title','Disc','Desc'].forEach(k => document.getElementById('fPrm'+k).value=''); };
        window.savePrm = async () => {
            let id = document.getElementById('fPrmId').value, t = document.getElementById('fPrmTitle').value;
            if(!t) return showToast("Judul wajib isi!", "red");
            let d = { title: t, discount_info: document.getElementById('fPrmDisc').value, description: document.getElementById('fPrmDesc').value, is_active: document.getElementById('fPrmActive').value==='true' };
            if(id) await update(ref(db, `promos/${id}`), d); else await push(ref(db, 'promos'), d);
            resetFPr(); showToast("Promo Tersimpan");
        };
        window.editPr = (id,o) => { document.getElementById('fPrmId').value = id; document.getElementById('fPrmTitle').value = o.title; document.getElementById('fPrmDisc').value = o.discount_info; document.getElementById('fPrmDesc').value = o.description; document.getElementById('fPrmActive').value = o.is_active?'true':'false'; };
        window.delPr = (id) => window.askConfirm("Hapus Promo?", "", async () => { await remove(ref(db,`promos/${id}`)); showToast("Terhapus"); });
        onValue(ref(db,'promos'), s => {
            let d = s.val()||{}, h='';
            for(let k in d) h += `<tr><td>${d[k].title}</td><td>${d[k].discount_info}</td><td>${d[k].is_active?'✅':'❌'}</td><td><button class="btn-action bg-blue" onclick='editPr("${k}",${JSON.stringify(d[k])})' style="padding:4px 10px; display:inline">Edit</button> <button class="btn-action bg-red" onclick='delPr("${k}")' style="padding:4px 10px; display:inline">Del</button></td></tr>`;
            document.getElementById('tblPrm').innerHTML = h;
        });

    </script>
</body>
</html>
